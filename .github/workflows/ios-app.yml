name: Native iOS test app
on:
  workflow_dispatch:
  push:
    branches: [main, native-ios-v34]
    paths: ['native-ios/**', '*.js', '*.html', '*.css', 'scripts/**', 'test-qrs/**', '.github/workflows/ios-app.yml']
permissions:
  contents: read
env:
  IOS_VERSION: 3.4.1
jobs:
  build-simulator-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bundle existing wallet for offline iOS launch
        run: node scripts/package-ios.cjs
      - name: Test CoreBluetooth shared framing
        run: |
          mkdir -p ios-dist
          set -o pipefail
          swift test --package-path native-ios | tee ios-dist/swift-assets-and-framing.log
          python3 scripts/test-ios-resources.py
      - name: Create clean disposable iPhone simulator
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[d for runtime,rows in sorted(devices.items(),reverse=True) if '.iOS-' in runtime for d in rows if d.get('isAvailable') and 'iPhone' in d['name']]
          assert candidates,'No iPhone simulator available'
          selected=candidates[0]
          runtime=next(r for r,rows in devices.items() if selected in rows)
          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          device_type=next(d['identifier'] for d in types if d['name']==selected['name'])
          fresh=subprocess.check_output(['xcrun','simctl','create','SignalPay-Clean-Release',device_type,runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+fresh+'\n')
          print('Created fresh simulator:',selected['name'],runtime,fresh)
          PY
      - name: Release simulator wallet and clean production launch tests
        run: |
          mkdir -p ios-dist
          set -o pipefail
          xcodebuild -project native-ios/SignalPay.xcodeproj -scheme SignalPay -configuration Release -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/signalpay-ios-simulator" -resultBundlePath ios-dist/SignalPay-simulator.xcresult CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test | tee ios-dist/simulator-build.log
          python3 scripts/verify-ios-resources.py --app "$RUNNER_TEMP/signalpay-ios-simulator/Build/Products/Release-iphonesimulator/SignalPay.app" --source-root . --report ios-dist/simulator-resources.json
          xcrun xcresulttool export attachments --path ios-dist/SignalPay-simulator.xcresult --output-path ios-dist/screenshots
      - name: Build unprovisioned arm64 iPhone signing package
        run: |
          set -o pipefail
          xcodebuild -project native-ios/SignalPay.xcodeproj -scheme SignalPay -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/signalpay-ios-device" CODE_SIGNING_ALLOWED=NO build | tee ios-dist/device-build.log
          mkdir -p ios-dist/Payload
          cp -R "$RUNNER_TEMP/signalpay-ios-device/Build/Products/Release-iphoneos/SignalPay.app" ios-dist/Payload/
          xcrun lipo -archs ios-dist/Payload/SignalPay.app/SignalPay | tee ios-dist/architectures.txt
          test "$(cat ios-dist/architectures.txt)" = arm64
          xcrun vtool -show-build ios-dist/Payload/SignalPay.app/SignalPay | tee ios-dist/device-platform.txt
          grep -E 'platform[[:space:]]+IOS$' ios-dist/device-platform.txt
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' ios-dist/Payload/SignalPay.app/Info.plist | grep '^com.signalpay.demo.ios$'
          test ! -e ios-dist/Payload/SignalPay.app/embedded.mobileprovision
          python3 scripts/verify-ios-resources.py --app ios-dist/Payload/SignalPay.app --source-root . --report ios-dist/device-resources.json
          (cd ios-dist && zip -qr "SignalPay-demo-ios-$IOS_VERSION-unsigned.ipa" Payload && shasum -a 256 "SignalPay-demo-ios-$IOS_VERSION-unsigned.ipa" > SHA256SUMS-iOS.txt)
          python3 scripts/verify-ios-resources.py --ipa "ios-dist/SignalPay-demo-ios-$IOS_VERSION-unsigned.ipa" --source-root . --report ios-dist/ipa-resources.json
          printf '%s\n' 'UNPROVISIONED iPhoneOS arm64 build. Requires Apple signing before installation. Not TestFlight, not directly installable, no physical phone/radio tests.' > ios-dist/SIGNING-REQUIRED.txt
      - name: Save iOS signing package and actual simulator reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SignalPay-iOS-test-build
          path: |
            ios-dist/*.ipa
            ios-dist/*.txt
            ios-dist/*.log
            ios-dist/*.xcresult
            ios-dist/*.json
            ios-dist/screenshots/
          if-no-files-found: warn

  publish-signing-package:
    if: github.ref == 'refs/heads/main'
    needs: build-simulator-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require successful shared browser verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 80); do
            result=$(gh run list --workflow qr-tests.yml --branch main --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/ios-v$IOS_VERSION" --jq '.object.sha' 2>/dev/null || true)
            if [ "$result" = $'completed\tsuccess' ] && [ "$tag_sha" = "$GITHUB_SHA" ]; then exit 0; fi
            if [[ "$result" == completed* && "$result" != $'completed\tsuccess' ]]; then echo 'Browser verification failed; iOS package release blocked.'; exit 1; fi
            sleep 10
          done
          exit 1
      - name: Publish unprovisioned iPhone signing package with explicit limitations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name SignalPay-iOS-test-build --dir ios-download
          node scripts/ios-release-notes.cjs > ios-download/release-notes.md
          gh release create "ios-v$IOS_VERSION" "ios-download/SignalPay-demo-ios-$IOS_VERSION-unsigned.ipa" ios-download/SHA256SUMS-iOS.txt ios-download/SIGNING-REQUIRED.txt ios-download/device-platform.txt ios-download/architectures.txt ios-download/ipa-resources.json ios-download/simulator-resources.json --target "$GITHUB_SHA" --title "SignalPay iOS $IOS_VERSION — bundled-file launch fix, signing required" --notes-file ios-download/release-notes.md --prerelease --latest=false
