plugins { id 'com.android.application' }

android {
    namespace 'com.signalpay.demo'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.signalpay.demo'
        minSdk 26
        targetSdk 35
        versionCode 311
        versionName '3.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('SIGNALPAY_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SIGNALPAY_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('SIGNALPAY_STORE_PASSWORD')
                keyAlias 'signalpay-demo'
                keyPassword System.getenv('SIGNALPAY_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
